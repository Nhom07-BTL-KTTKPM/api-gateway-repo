spring:
  cloud:
    gateway:
      mvc:
        routes:
          - id: auth-service
            uri: http://auth-service:8080
            predicates:
              - Path=/api/v1/auth/**
            filters:
              - StripPrefix=2
              - name: Retry
                args:
                  retries: 3
                  methods: GET,POST,PUT,DELETE
                  statuses: BAD_GATEWAY,GATEWAY_TIMEOUT,INTERNAL_SERVER_ERROR
                  backoff:
                    firstBackoff: 1s
                    maxBackoff: 5s
                    factor: 2
                    basedOnPreviousValue: false
              - name: CircuitBreaker
                args:
                  id: authCircuitBreaker
                  fallbackUri: forward:/fallback/auth-service

          - id: user-service
            uri: http://user-service:8080
            predicates:
              - Path=/api/v1/user/**
            filters:
              - StripPrefix=2
              - name: Retry
