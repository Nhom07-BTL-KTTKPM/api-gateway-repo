spring:
  mvc:
    async:
      request-timeout: 30s
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service-critical
              uri: http://auth-service:8080
              predicates:
                - Path=/api/v1/auth/login,/api/v1/auth/register,/api/v1/auth/refresh,/api/v1/auth/logout

            - id: auth-service-write
              uri: http://auth-service:8080
              predicates:
                - Path=/api/v1/auth/**
                - Method=POST,PUT,PATCH,DELETE

            - id: auth-service
              uri: http://auth-service:8080
              predicates:
                - Path=/api/v1/auth/**
                - Method=GET
              filters:
                - name: Retry
                  args:
                    retries: 3
                    methods: GET
                    statuses: BAD_GATEWAY,GATEWAY_TIMEOUT,INTERNAL_SERVER_ERROR
                    backoff:
                      firstBackoff: 1s
                      maxBackoff: 5s
                      factor: 2
                      basedOnPreviousValue: false
                - name: CircuitBreaker
                  args:
                    id: authCircuitBreaker
                    fallbackUri: forward:/fallback/auth-service

            - id: user-service
              uri: http://user-service:8080
              predicates:
                - Path=/api/v1/user/**
                - Method=POST,PUT,PATCH,DELETE

            - id: user-service-read
              uri: http://user-service:8080
              predicates:
                - Path=/api/v1/user/**
                - Method=GET
              filters:
                - name: Retry
                  args:
                    retries: 3
                    methods: GET
                    statuses: BAD_GATEWAY,GATEWAY_TIMEOUT,INTERNAL_SERVER_ERROR
                - name: CircuitBreaker
                  args:
                    id: userCircuitBreaker
                    fallbackUri: forward:/fallback/user-service

            - id: catalog-service
              uri: http://catalog-service:8080
              predicates:
                - Path=/api/v1/catalog/**
                - Method=POST,PUT,PATCH,DELETE

            - id: catalog-service-read
              uri: http://catalog-service:8080
              predicates:
                - Path=/api/v1/catalog/**
                - Method=GET
              filters:
                - name: Retry
                  args:
                    retries: 3
                    methods: GET
                    statuses: BAD_GATEWAY,GATEWAY_TIMEOUT,INTERNAL_SERVER_ERROR
                - name: CircuitBreaker
                  args:
                    id: catalogCircuitBreaker
                    fallbackUri: forward:/fallback/catalog-service

            - id: cart-service
              uri: http://cart-service:8080
              predicates:
                - Path=/api/v1/cart/**
                - Method=POST,PUT,PATCH,DELETE

            - id: cart-service-read
              uri: http://cart-service:8080
              predicates:
                - Path=/api/v1/cart/**
