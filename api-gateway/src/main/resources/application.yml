spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2s}
  cloud:
    gateway:
      mvc:
        routes:
          - id: auth-service
            uri: lb://AUTH-SERVICE
            predicates:
              - Path=/api/v1/auth/**
            filters:
              - StripPrefix=2
              - name: Retry
                args:
                  retries: 3
                  methods: GET,POST,PUT,DELETE
                  statuses: BAD_GATEWAY,GATEWAY_TIMEOUT,INTERNAL_SERVER_ERROR
                  backoff:
                    firstBackoff: 1s
                    maxBackoff: 5s
                    factor: 2
                    basedOnPreviousValue: false
              - name: CircuitBreaker
                args:
                  id: authCircuitBreaker
                  fallbackUri: forward:/fallback/auth-service

          - id: user-service
            uri: lb://USER-SERVICE
            predicates:
              - Path=/api/v1/user/**
            filters:
              - StripPrefix=2
              - name: Retry
                args:
                  retries: 3
                  methods: GET,POST,PUT,DELETE
                  statuses: BAD_GATEWAY,GATEWAY_TIMEOUT,INTERNAL_SERVER_ERROR
              - name: CircuitBreaker
                args:
                  id: userCircuitBreaker
                  fallbackUri: forward:/fallback/user-service

          - id: catalog-service
            uri: lb://CATALOG-SERVICE
            predicates:
              - Path=/api/v1/catalog/**
            filters:
              - StripPrefix=2
              - name: Retry
                args:
                  retries: 3
                  methods: GET,POST,PUT,DELETE
                  statuses: BAD_GATEWAY,GATEWAY_TIMEOUT,INTERNAL_SERVER_ERROR
              - name: CircuitBreaker
                args:
                  id: catalogCircuitBreaker
                  fallbackUri: forward:/fallback/catalog-service

          - id: cart-service
            uri: lb://CART-SERVICE
            predicates:
              - Path=/api/v1/cart/**
            filters:
              - StripPrefix=2
              - name: Retry
                args:
                  retries: 3
                  methods: GET,POST,PUT,DELETE
                  statuses: BAD_GATEWAY,GATEWAY_TIMEOUT,INTERNAL_SERVER_ERROR
              - name: CircuitBreaker
                args:
                  id: cartCircuitBreaker
                  fallbackUri: forward:/fallback/cart-service

          - id: order-service
            uri: lb://ORDER-SERVICE
            predicates:
              - Path=/api/v1/order/**
            filters:
              - StripPrefix=2
              - name: Retry
                args:
                  retries: 3
                  methods: GET,POST,PUT,DELETE
                  statuses: BAD_GATEWAY,GATEWAY_TIMEOUT,INTERNAL_SERVER_ERROR
              - name: CircuitBreaker
                args:
                  id: orderCircuitBreaker
                  fallbackUri: forward:/fallback/order-service

          - id: ai-service
            uri: lb://AI-SERVICE
            predicates:
              - Path=/api/v1/ai/**
            filters:
              - StripPrefix=2
              - name: Retry
                args:
                  retries: 3
                  methods: GET,POST,PUT,DELETE
                  statuses: BAD_GATEWAY,GATEWAY_TIMEOUT,INTERNAL_SERVER_ERROR
              - name: CircuitBreaker
                args:
                  id: aiCircuitBreaker
                  fallbackUri: forward:/fallback/ai-service

          - id: notification-service
            uri: lb://NOTIFICATION-SERVICE
            predicates:
              - Path=/api/v1/notification/**
            filters:
              - StripPrefix=2
              - name: Retry
                args:
                  retries: 3
                  methods: GET,POST,PUT,DELETE
                  statuses: BAD_GATEWAY,GATEWAY_TIMEOUT,INTERNAL_SERVER_ERROR
              - name: CircuitBreaker
                args:
                  id: notificationCircuitBreaker
                  fallbackUri: forward:/fallback/notification-service

server:
  port: ${SERVER_PORT:8080}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

resilience4j:
  retry:
    instances:
      gatewayRetry:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
  ratelimiter:
    instances:
      gatewayClientRateLimiter:
        limitForPeriod: 5
        limitRefreshPeriod: 60s
        timeoutDuration: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info

gateway:
  cors:
    allowed-origins: ${GATEWAY_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  rate-limit:
    enabled: ${GATEWAY_RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${GATEWAY_RATE_LIMIT_REQUESTS_PER_MINUTE:5}
    redis-key-prefix: ${GATEWAY_RATE_LIMIT_KEY_PREFIX:gateway:rate-limit:}
