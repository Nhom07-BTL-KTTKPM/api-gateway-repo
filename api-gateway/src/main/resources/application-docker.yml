              filters:
                - name: Retry
                  args:
                    retries: 3
                    methods: GET
                    statuses: BAD_GATEWAY,GATEWAY_TIMEOUT,INTERNAL_SERVER_ERROR
                - name: CircuitBreaker
                  args:
                    id: cartCircuitBreaker
                    fallbackUri: forward:/fallback/cart-service

            - id: order-service
              uri: http://order-service:8080
              predicates:
                - Path=/api/v1/order/**
                - Method=POST,PUT,PATCH,DELETE

            - id: order-service-read
              uri: http://order-service:8080
              predicates:
                - Path=/api/v1/order/**
                - Method=GET
              filters:
                - name: Retry
                  args:
                    retries: 3
                    methods: GET
                    statuses: BAD_GATEWAY,GATEWAY_TIMEOUT,INTERNAL_SERVER_ERROR
                - name: CircuitBreaker
                  args:
                    id: orderCircuitBreaker
                    fallbackUri: forward:/fallback/order-service

            - id: ai-service
              uri: http://ai-service:8080
              predicates:
                - Path=/api/v1/ai/**
                - Method=POST,PUT,PATCH,DELETE

            - id: ai-service-read
              uri: http://ai-service:8080
              predicates:
                - Path=/api/v1/ai/**
                - Method=GET
              filters:
