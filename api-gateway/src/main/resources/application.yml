spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: ${REDIS_TIMEOUT}
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service-critical
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/v1/auth/login,/api/v1/auth/register,/api/v1/auth/refresh,/api/v1/auth/logout,/api/v1/auth/google

            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/v1/auth/**
              filters:
                - name: Retry
                  args:
                    retries: 3
                    methods: GET
                    statuses: BAD_GATEWAY,GATEWAY_TIMEOUT,INTERNAL_SERVER_ERROR
                    backoff:
                      firstBackoff: 1s
                      maxBackoff: 5s
                      factor: 2
                      basedOnPreviousValue: false
                - name: CircuitBreaker
                  args:
                    id: authCircuitBreaker
                    fallbackUri: forward:/fallback/auth-service

            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/v1/user/**,/api/v1/customers/**
              filters:
                - name: Retry
                  args:
                    retries: 3
                    methods: GET
                    statuses: BAD_GATEWAY,GATEWAY_TIMEOUT,INTERNAL_SERVER_ERROR
                - name: CircuitBreaker
                  args:
                    id: userCircuitBreaker
                    fallbackUri: forward:/fallback/user-service

            - id: catalog-service
              uri: lb://CATALOG-SERVICE
              predicates:
                - Path=/api/v1/catalog/**
              filters:
                - name: Retry
                  args:
                    retries: 3
                    methods: GET
                    statuses: BAD_GATEWAY,GATEWAY_TIMEOUT,INTERNAL_SERVER_ERROR
                - name: CircuitBreaker
                  args:
                    id: catalogCircuitBreaker
                    fallbackUri: forward:/fallback/catalog-service

            - id: cart-service
              uri: lb://CART-SERVICE
              predicates:
                - Path=/api/v1/cart/**,/api/v1/carts/**
              filters:
                - name: Retry
                  args:
                    retries: 3
                    methods: GET
                    statuses: BAD_GATEWAY,GATEWAY_TIMEOUT,INTERNAL_SERVER_ERROR
                - name: CircuitBreaker
                  args:
                    id: cartCircuitBreaker
                    fallbackUri: forward:/fallback/cart-service

            - id: order-service
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/api/v1/order/**,/api/v1/orders/**
              filters:
                - name: Retry
                  args:
                    retries: 3
                    methods: GET
                    statuses: BAD_GATEWAY,GATEWAY_TIMEOUT,INTERNAL_SERVER_ERROR
                - name: CircuitBreaker
                  args:
                    id: orderCircuitBreaker
                    fallbackUri: forward:/fallback/order-service

            - id: payment-service
              uri: lb://PAYMENT-SERVICE
              predicates:
                - Path=/api/v1/payment/**
              filters:
                - name: Retry
                  args:
                    retries: 3
                    methods: GET,POST
                    statuses: BAD_GATEWAY,GATEWAY_TIMEOUT,INTERNAL_SERVER_ERROR
                - name: CircuitBreaker
                  args:
                    id: paymentCircuitBreaker
                    fallbackUri: forward:/fallback/payment-service

            - id: ai-service
              uri: lb://AI-SERVICE
              predicates:
                - Path=/api/v1/ai/**
              filters:
                - name: Retry
                  args:
                    retries: 3
                    methods: GET
                    statuses: BAD_GATEWAY,GATEWAY_TIMEOUT,INTERNAL_SERVER_ERROR
                - name: CircuitBreaker
                  args:
                    id: aiCircuitBreaker
                    fallbackUri: forward:/fallback/ai-service

            - id: notification-service
              uri: lb://NOTIFICATION-SERVICE
              predicates:
                - Path=/api/v1/notification/**
              filters:
                - name: Retry
                  args:
                    retries: 3
                    methods: GET
                    statuses: BAD_GATEWAY,GATEWAY_TIMEOUT,INTERNAL_SERVER_ERROR
                - name: CircuitBreaker
                  args:
                    id: notificationCircuitBreaker
                    fallbackUri: forward:/fallback/notification-service

            - id: upload-service
              uri: lb://UPLOAD-SERVICE
              predicates:
                - Path=/api/v1/upload/**
              filters:
                - name: Retry
                  args:
                    retries: 3
                    methods: GET,POST
                    statuses: BAD_GATEWAY,GATEWAY_TIMEOUT,INTERNAL_SERVER_ERROR
                - name: CircuitBreaker
                  args:
                    id: uploadCircuitBreaker
                    fallbackUri: forward:/fallback/upload-service

server:
  port: ${SERVER_PORT}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE}
  instance:
    prefer-ip-address: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS}
    ip-address: ${EUREKA_INSTANCE_IP_ADDRESS}
    hostname: ${EUREKA_INSTANCE_HOSTNAME}

management:
  endpoints:
    web:
      exposure:
        include: health,info

gateway:
  cors:
    allowed-origins: ${GATEWAY_ALLOWED_ORIGINS}
  rate-limit:
    enabled: ${GATEWAY_RATE_LIMIT_ENABLED}
    requests-per-minute: ${GATEWAY_RATE_LIMIT_REQUESTS_PER_MINUTE}
    redis-key-prefix: ${GATEWAY_RATE_LIMIT_KEY_PREFIX}

resilience4j:
  timelimiter:
    instances:
      aiCircuitBreaker:
        timeoutDuration: 60s
  circuitbreaker:
    instances:
      aiCircuitBreaker:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
      uploadCircuitBreaker:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
